name: Reusable CLI release

on:
  workflow_call:
    inputs:
      language:
        description: "Project language: go or rust"
        required: true
        type: string
      binary:
        description: Executable name produced by the project
        required: true
        type: string
      package-identifier:
        description: macOS pkgbuild identifier, such as com.example.myapp
        required: true
        type: string
      goreleaser-config:
        description: Path to GoReleaser configuration in the consuming repository
        required: false
        default: .goreleaser.yaml
        type: string
      working-directory:
        description: Project directory in the consuming repository
        required: false
        default: .
        type: string
      go-version-file:
        description: Go version source used by setup-go
        required: false
        default: go.mod
        type: string
      rust-toolchain:
        description: Rust toolchain channel
        required: false
        default: stable
        type: string
      index-go-module:
        description: Prompt the public Go module proxy to index this root module after release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        if: inputs.language == 'go'
        with:
          go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.language == 'rust'
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - name: Validate release language
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          case "$LANGUAGE" in
            go|rust) ;;
            *) echo "language must be go or rust" >&2; exit 2 ;;
          esac
      - name: Validate Go module tag
        if: inputs.language == 'go'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Go module releases require a stable SemVer tag such as v0.1.0; got $TAG" >&2
            exit 1
          fi
      - name: Check Rust package version matches the Git tag
        if: inputs.language == 'rust'
        working-directory: ${{ inputs.working-directory }}
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$package_version" = "$VERSION" || {
            echo "Cargo package version $package_version does not match tag $VERSION" >&2
            exit 1
          }
      - name: Test Go project
        if: inputs.language == 'go'
        working-directory: ${{ inputs.working-directory }}
        run: go test ./...
      - name: Test Rust project
        if: inputs.language == 'rust'
        working-directory: ${{ inputs.working-directory }}
        run: cargo test --locked
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3
          args: release --clean --config ${{ inputs.working-directory }}/${{ inputs.goreleaser-config }}
          workdir: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-pkg:
    needs: linux-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-go@v6
        if: inputs.language == 'go'
        with:
          go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.language == 'rust'
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - name: Build native macOS executable
        working-directory: ${{ inputs.working-directory }}
        env:
          LANGUAGE: ${{ inputs.language }}
          BINARY: ${{ inputs.binary }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$LANGUAGE" == go ]]; then VERSION="${TAG#v}"; else VERSION="$TAG"; fi
          mkdir -p "$RUNNER_TEMP/pkgroot/usr/local/bin"
          case "$LANGUAGE" in
            go)
              go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$RUNNER_TEMP/pkgroot/usr/local/bin/$BINARY" .
              ;;
            rust)
              cargo build --locked --release
              install -m 755 "target/release/$BINARY" "$RUNNER_TEMP/pkgroot/usr/local/bin/$BINARY"
              ;;
            *) echo "language must be go or rust" >&2; exit 2 ;;
          esac
      - name: Build installer and checksum
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          PACKAGE_IDENTIFIER: ${{ inputs.package-identifier }}
          BINARY: ${{ inputs.binary }}
        run: |
          if [[ "${TAG}" == v* ]]; then VERSION="${TAG#v}"; else VERSION="$TAG"; fi
          mkdir -p dist
          sudo xattr -cr "$RUNNER_TEMP/pkgroot"
          if xattr -lr "$RUNNER_TEMP/pkgroot" | grep -q .; then
            echo "package staging still has extended attributes" >&2
            exit 1
          fi
          pkgbuild \
            --root "$RUNNER_TEMP/pkgroot" \
            --identifier "$PACKAGE_IDENTIFIER" \
            --version "$VERSION" \
            --install-location / \
            "dist/${BINARY}_${VERSION}_darwin_${ARCH}.pkg"
          shasum -a 256 "dist/${BINARY}_${VERSION}_darwin_${ARCH}.pkg" > "dist/${BINARY}_${VERSION}_darwin_${ARCH}.pkg.sha256"
      - name: Upload macOS package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          BINARY: ${{ inputs.binary }}
        run: |
          if [[ "$TAG" == v* ]]; then VERSION="${TAG#v}"; else VERSION="$TAG"; fi
          gh release upload "$TAG" "dist/${BINARY}_${VERSION}_darwin_${ARCH}.pkg" "dist/${BINARY}_${VERSION}_darwin_${ARCH}.pkg.sha256" --clobber

  publish:
    needs: macos-pkg
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  go-module-index:
    needs: publish
    if: inputs.language == 'go' && inputs.index-go-module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
          cache: true
      - name: Request Go module proxy indexing
        working-directory: ${{ inputs.working-directory }}
        env:
          TAG: ${{ github.ref_name }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          if [[ "$WORKING_DIRECTORY" != "." && "$WORKING_DIRECTORY" != "./" ]]; then
            echo "Go module indexing currently supports a module at the repository root" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Go module indexing requires a stable SemVer tag such as v0.1.0; got $TAG" >&2
            exit 1
          fi
          module_path="$(go list -m)"
          for attempt in $(seq 1 12); do
            if GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go list -m "${module_path}@${TAG}"; then
              exit 0
            fi
            echo "Go proxy has not indexed ${module_path}@${TAG} yet (attempt ${attempt}/12)"
            sleep 10
          done
          echo "Go proxy did not index ${module_path}@${TAG} after 120 seconds" >&2
          exit 1
