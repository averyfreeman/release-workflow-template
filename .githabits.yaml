schema_version: 1.0.0
version: 1
# For every substantive change, commit and release after validation, then push
# the branch and its tag to origin. Use major for breaking changes, minor for
# new features, and patch for other substantive changes. Keep tags in the
# existing MAJOR.MINOR.PATCH format (without a "v" prefix). Never force-push.
profile: autonomous
branch: main
versioning: semver
initial_tag: 0.1.0
commit_style: conventional-commits
semantic_release: true
actions:
    init: true
    branch: true
    stage: true
    commit: true
    tag: true
    remote: true
    push: true
remote:
    provider: github
    owner: averyfreeman
    name: release-workflow-template
    visibility: public
    alias: origin
    status: configured
    url: https://github.com/averyfreeman/release-workflow-template.git
