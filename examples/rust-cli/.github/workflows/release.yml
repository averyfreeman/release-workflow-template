name: Release

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: averyfreeman/release-workflow-template/.github/workflows/release.yml@0.1.0
    with:
      language: rust
      binary: example-rust-cli
      package-identifier: com.example.rust-cli
