name: Release

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: averyfreeman/release-workflow-template/.github/workflows/release.yml@0.1.1
    with:
      language: go
      binary: example-go-cli
      package-identifier: com.example.go-cli
